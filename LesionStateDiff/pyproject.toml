[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lesionstatediff"
version = "0.1.0"
description = "Spatial-semantic diffusion for controllable IVOCT lesion resynthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "diffusers>=0.30",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

